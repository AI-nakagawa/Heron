<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174c3c"><meta name="description" content="三角形・台形を辺でつないで計算・記録できる現場用PWA"><title>現場面積ノート</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=12.3"><link rel="stylesheet" href="mobile-input.css?v=12.3"><link rel="stylesheet" href="features.css?v=12.3"></head>
<body><header class="app-header"><div><p class="eyebrow">FIELD AREA NOTE</p><h1>現場面積ノート</h1></div><div class="header-actions"><button id="outdoorButton" class="icon-button" type="button" aria-pressed="false" title="屋外モード（高コントラスト・大きいボタン）">☀ 屋外</button><button id="settingsButton" class="icon-button" type="button">設定</button><button id="installButton" class="icon-button hidden" type="button">アプリを追加</button></div></header>
<main><nav class="tabs" aria-label="画面切替"><button class="tab active" data-view="drawing" type="button">連続図面</button><button class="tab" data-view="history" type="button">保存履歴 <span id="historyCount" class="count">0</span></button></nav>
<section id="drawingView" class="view active">
<section id="projectCard" class="card project-card"><button id="projectExpand" class="project-summary" type="button" aria-expanded="false" aria-label="名称・日付・設計面積を開く"><span id="projectSummaryText" class="project-summary-text"></span><span class="project-toggle">開く ▼</span></button><button id="projectCollapse" class="project-collapse" type="button" aria-label="名称・日付・設計面積を畳む">畳む ▲</button><div class="field-grid meta-grid"><label class="field"><span>名称・測点名 <em>必須</em></span><div class="voice-field"><input id="name" type="text" maxlength="60" placeholder="例：区画 A-12"><button class="voice-button" type="button" data-voice-target="name" aria-label="名称・測点名を音声入力">🎙</button></div></label><label class="field"><span>日付</span><input id="date" type="date"></label><label class="field design-field"><span>設計面積</span><div class="with-unit"><input id="designArea" type="text" inputmode="decimal" autocomplete="off" placeholder="比較する場合に入力"><b>m²</b></div></label></div></section>
<section class="card canvas-card"><div class="canvas-heading"><div><p class="section-label">連続図面</p><small id="canvasHint">最初の図形を追加してください</small></div><div class="canvas-tools"><button id="openMeasureTool" class="measure-tool" type="button">📐 入力</button><button id="fitButton" type="button">全体表示</button><button id="printButton" type="button" disabled>PDF出力</button></div></div><div class="drawing-scroll"><svg id="drawingCanvas" viewBox="0 0 700 430" role="img" aria-label="接続した図形の図面"></svg></div><div class="drawing-summary"><span><b id="shapeCount">0</b> 図形</span><strong>合計 <span id="drawingTotal">0.000</span> m²</strong></div><div id="designSummary" class="design-summary hidden"></div></section>
<section class="card add-card"><div id="editBanner" class="edit-banner hidden"><span id="editBannerText"></span><button id="cancelEditButton" class="text-button" type="button">修正をやめる</button></div><div id="connectionPanel" class="connection-panel hidden"><p class="section-label">1. 接続する辺を選択</p><p class="helper">図面上の緑色の辺をタップするか、一覧から選びます。</p><select id="edgeSelect" aria-label="接続する辺"></select></div><p class="section-label"><span id="stepNumber">1</span>. 追加する図形</p><div class="mode-switch" role="radiogroup" aria-label="図形の種類"><button class="mode active" data-mode="triangle" role="radio" aria-checked="true" type="button"><span>△</span>三角形</button><button class="mode" data-mode="trapezoid" role="radio" aria-checked="false" type="button"><span>▱</span>台形</button></div>
<button id="openMeasureButton" class="measure-launch" type="button"><span class="measure-launch-icon">📐</span><span><b>図面を見ながら入力</b><small>音声・手入力。図面が見えたまま、続けて追加できます</small></span></button>
<div id="triangleFields" class="dimensions"><div class="field-grid three-columns"><label class="field"><span>辺 a</span><div class="with-unit"><input id="sideA" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label><label class="field"><span>辺 b</span><div class="with-unit"><input id="sideB" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label><label class="field"><span id="sideCLabel">辺 c</span><div class="with-unit"><input id="sideC" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label></div><button id="swapButton" class="swap-button" type="button">⇄ a と b を入れ替え</button></div>
<div id="trapezoidFields" class="dimensions hidden"><div class="field-grid three-columns"><label class="field"><span>上底</span><div class="with-unit"><input id="topBase" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label><label class="field"><span id="bottomBaseLabel">下底</span><div class="with-unit"><input id="bottomBase" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label><label class="field"><span>高さ</span><div class="with-unit"><input id="height" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"><b>m</b></div></label></div><fieldset class="align-field"><legend>上底の配置</legend><div class="segment"><label><input type="radio" name="alignment" value="left">左揃え</label><label><input type="radio" name="alignment" value="center" checked>中央揃え</label><label><input type="radio" name="alignment" value="right">右揃え</label></div></fieldset></div>
<label id="flipField" class="flip-field hidden"><input id="flipDirection" type="checkbox"><span>接続方向を反転する</span></label><div id="previewBox" class="preview-box idle" aria-live="polite"></div><div id="message" class="message" role="alert" aria-live="polite"></div><button id="addShapeButton" class="primary-button full-button" type="button">この図形を追加</button></section>
<section id="partsSection" class="card parts-card hidden"><div class="parts-heading"><p class="section-label">追加した図形</p><button id="undoButton" class="text-button danger-text" type="button">最後の図形を戻す</button></div><div id="partsList" class="parts-list"></div></section>
<section class="card memo-card"><label class="field"><span>現場メモ</span><div class="voice-field"><textarea id="memo" rows="3" maxlength="500" placeholder="現場状況、写真番号、補足など"></textarea><button class="voice-button" type="button" data-voice-target="memo" aria-label="現場メモを音声入力">🎙</button></div></label></section><div class="sticky-actions"><button id="newButton" class="secondary-button" type="button">新規</button><button id="saveDrawingButton" class="primary-button" type="button">図面を保存</button></div></section>
<section id="historyView" class="view"><div class="history-heading"><div><p class="eyebrow">SAVED DRAWINGS</p><h2>保存履歴</h2></div></div><div id="historyList" class="history-list"></div><div id="emptyState" class="empty-state"><span>△</span><h3>まだ図面がありません</h3><p>三角形や台形をつないで、図面全体を保存できます。</p></div><details class="backup-card"><summary>データ出力・バックアップ</summary><p>CSVは面積一覧（設計面積との差を含む）、JSONは図面を含む復元用データです。</p><div class="backup-actions"><button id="exportCsvButton" type="button">CSV出力</button><button id="exportJsonButton" type="button">JSON保存</button><label class="file-button">JSONから復元<input id="importJsonInput" type="file" accept="application/json,.json"></label></div></details></section></main>
<section id="measureOverlay" class="measure-overlay" hidden aria-label="図面を見ながら入力"><div class="measure-toolbar"><button id="measureClose" class="m-btn" type="button" aria-label="閉じる">✕</button><button id="measureMode" class="m-btn" type="button">△ 三角形</button><button id="measureSwap" class="m-btn" type="button">⇄ a・b</button><button id="measureFlip" class="m-btn" type="button" aria-pressed="false">反転</button><button id="measureUndo" class="m-btn" type="button" aria-label="最後の図形を戻す">↶ 戻す</button></div><div id="measureTotal" class="measure-total"></div><div class="measure-canvas-wrap"><svg id="measureCanvas" viewBox="0 0 700 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="図面"></svg></div><div class="measure-panel"><div id="measureHint" class="measure-hint"><span id="quickHint">a・b・c の順に3つ</span><span id="measureEdge"></span></div><div id="quickParsed" class="quick-parsed" aria-live="polite"></div><div id="measureStatus" class="measure-status" aria-live="polite"></div><div class="measure-input-row"><input id="quickInput" type="text" inputmode="text" enterkeyhint="enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：3.01 4.25 3" aria-label="寸法（続けて入力）"><button id="measureNext" class="m-btn hidden" type="button" aria-label="次の数値">次␣</button><button id="measureKeyboard" class="m-btn" type="button">123</button><button id="measureAdd" class="m-add" type="button">追加</button></div></div></section>
<section id="printSheet" aria-hidden="true"></section><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="confirmDialog"><h2 id="confirmTitle">確認</h2><p id="confirmText"></p><div class="dialog-actions"><button id="cancelConfirmButton" class="secondary-button" type="button">キャンセル</button><button id="acceptConfirmButton" class="danger-button" type="button">実行</button></div></dialog>
<dialog id="settingsDialog" class="settings-dialog"><h2>設定</h2><div class="field-grid"><label class="field"><span>面積の桁数</span><select id="setDigits"><option value="1">小数第1位</option><option value="2">小数第2位</option><option value="3">小数第3位</option></select></label><label class="field"><span>丸め方</span><select id="setMethod"><option value="round">四捨五入</option><option value="floor">切り捨て</option><option value="ceil">切り上げ</option></select></label><label class="field"><span>合計の出し方</span><select id="setSumMode"><option value="total">合計してから丸める</option><option value="each">図形ごとに丸めてから合計</option></select></label></div><label class="check-row"><input id="setSignalAdd" type="checkbox"><span>数がそろった後の「はい」「OK」で図形を追加する</span></label><label class="check-row"><input id="setOutdoor" type="checkbox"><span>屋外モード（高コントラスト・大きいボタン）</span></label><label class="check-row"><input id="setWakeLock" type="checkbox"><span>使用中は画面を消灯させない</span></label><p id="wakeLockStatus" class="helper"></p><div class="dialog-actions single"><button id="closeSettingsButton" class="primary-button" type="button">閉じる</button></div></dialog>
<script src="numbers.js?v=12.3" defer></script><script src="app.js?v=12.3" defer></script></body></html>
